<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Authentication Callback</title>
</head>
<body style="background: #0b0c10; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <h2>Authenticating with Google...</h2>
    <p>Please wait while we complete your sign in.</p>
  </div>
  <script>
    (function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const idToken = params.get('id_token');

      if (accessToken || idToken) {
        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_AUTH_SUCCESS',
            accessToken: accessToken,
            idToken: idToken
          }, '*');
          window.close();
        } else {
          window.location.href = '/?access_token=' + (accessToken || idToken);
        }
      } else {
        document.querySelector('h2').innerText = 'Authentication Failed';
        document.querySelector('p').innerText = 'No access token returned from Google.';
      }
    })();
  </script>
</body>
</html>
